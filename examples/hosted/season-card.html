<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Season tickets</title>
</head>
<body>
  <!--
    A season card: a plain link to the SeatLayer booking page for your season.
    No script runs. Style the card with your own CSS.
    Use the booking link from the season's Sell tab in the dashboard.
    Try it live: https://seatlayer.io/demo/hosted/season-ticket/
  -->
  <!-- SeatLayer season card -->
  <div class="seatlayer-season-card">
    <a href="https://app.seatlayer.io/s/<YOUR_SEASON_KEY>">Your season: book season tickets</a>
  </div>
</body>
</html>
